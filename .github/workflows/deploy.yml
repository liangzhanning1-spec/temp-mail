name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Ensure D1 database exists
        id: d1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q 'REPLACE_WITH_YOUR_D1_DATABASE_ID' wrangler.toml; then
            # 尝试创建；已存在时报错则从列表里取回 id
            OUT=$(npx wrangler d1 create de5_mailhub 2>&1 || true)
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
            if [ -z "$ID" ]; then
              ID=$(npx wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['uuid'] for x in d if x['name']=='de5_mailhub'), ''))" || true)
            fi
            if [ -n "$ID" ]; then
              sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
              echo "D1 database id: $ID"
            else
              echo "::error::无法创建或找到 D1 数据库，请在 Cloudflare 手动创建 de5_mailhub 并填入 wrangler.toml"
              exit 1
            fi
          fi

      - name: Init D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute de5_mailhub --remote --file=schema.sql || true

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
