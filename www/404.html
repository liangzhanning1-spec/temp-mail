<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 — 1m.de5.net 临时邮箱</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://1m.de5.net/">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Noto+Serif+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee;
  --ink: #15140f;
  --ink-dim: #6a6358;
  --ink-faint: #ada49a;
  --indigo: #4f46e5;
  --coral: #fb7185;
  --emerald: #059669;
  --line: rgba(21, 20, 15, 0.08);
  --line-bright: rgba(21, 20, 15, 0.15);
  --f-display: 'Bricolage Grotesque', sans-serif;
  --f-serif: 'Noto Serif SC', serif;
  --f-sans: 'Inter', sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: url('/img/hero-bg.jpg') center / cover no-repeat;
}
.scrim {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(246, 243, 238, 0.82) 0%, rgba(246, 243, 238, 0.55) 50%, rgba(246, 243, 238, 0.82) 100%),
    radial-gradient(ellipse 700px 500px at 15% 10%, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse 600px 500px at 85% 20%, rgba(251, 113, 133, 0.04) 0%, transparent 50%);
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.03;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.3rem 2.5rem;
}
.nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); }
.nav-logo-mark {
  width: 30px; height: 30px;
  background: var(--ink);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--f-display);
  font-size: 0.65rem;
  font-weight: 800;
  color: var(--bg);
}
.nav-logo-text { font-family: var(--f-mono); font-size: 0.82rem; color: var(--ink-dim); letter-spacing: 0.04em; }
.nav-cta {
  font-family: var(--f-mono);
  font-size: 0.78rem;
  padding: 0.5rem 1.2rem;
  background: var(--ink);
  color: var(--bg);
  border-radius: 100px;
  text-decoration: none;
  letter-spacing: 0.03em;
  transition: all 0.3s;
}
.nav-cta:hover { background: var(--indigo); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25); }

.card {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 3rem 2rem;
  max-width: 560px;
  width: 100%;
}
.big-404 {
  font-family: var(--f-display);
  font-size: clamp(7rem, 22vw, 11rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  color: transparent;
  -webkit-text-stroke: 2px rgba(21, 20, 15, 0.16);
  position: relative;
}
.big-404::after {
  content: '404';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--indigo), var(--coral));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 0.25;
  transform: translate(6px, 6px);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--f-mono);
  font-size: 0.7rem;
  color: var(--indigo);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.35rem 0.9rem;
  background: rgba(79, 70, 229, 0.06);
  border: 1px solid rgba(79, 70, 229, 0.15);
  border-radius: 100px;
  margin-bottom: 1.6rem;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 6px rgba(251,113,133,0.5); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
h1 {
  font-family: var(--f-display);
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.desc {
  font-family: var(--f-serif);
  font-size: 1.02rem;
  font-weight: 300;
  line-height: 2;
  color: var(--ink-dim);
  margin-bottom: 2.4rem;
}
.desc strong { color: var(--ink); font-weight: 600; }
.actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
.btn {
  font-family: var(--f-mono);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 0.8rem 1.6rem;
  border-radius: 12px;
  text-decoration: none;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--indigo); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3); }
.btn-ghost { border: 1px solid var(--line-bright); color: var(--ink-dim); background: rgba(255,253,248,0.8); }
.btn-ghost:hover { border-color: var(--indigo); color: var(--indigo); }
.hint {
  font-family: var(--f-mono);
  font-size: 0.68rem;
  color: var(--ink-faint);
  margin-top: 2rem;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="scrim"></div>

<nav>
  <a class="nav-logo" href="/">
    <div class="nav-logo-mark">1m</div>
    <span class="nav-logo-text">1m.de5.net</span>
  </a>
  <a class="nav-cta" href="/">生成邮箱 →</a>
</nav>

<div class="card">
  <div class="badge"><span class="dot"></span>404 · PAGE NOT FOUND</div>
  <div class="big-404">404</div>
  <h1>这个页面不存在</h1>
  <p class="desc">它可能从未存在过，也可能——<br>像临时邮箱一样，<strong>已经过期自毁了</strong>。</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">⚡ 生成一个新邮箱</a>
    <a class="btn btn-ghost" href="/blog">← 博客</a>
  </div>
  <div class="hint">0 数据保留 · 到期自动销毁</div>
</div>

</body>
</html>
